name: Android CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Read app version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$version_name"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Verify source and browser client
        run: ./scripts/check-static.sh

      - name: Run Android tests and lint
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug lintRelease

      - name: Build debug and unsigned release APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: PlainCast-${{ steps.app.outputs.version_name }}-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
