name: Publish Android release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.0.0
        required: true
        default: v2.0.0

permissions:
  contents: write

concurrency:
  group: plaincast-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish signed APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Validate release tag and signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAINCAST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PLAINCAST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAINCAST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAINCAST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test "$RELEASE_TAG" = "v$VERSION_NAME" || {
            echo "Tag $RELEASE_TAG does not match app version $VERSION_NAME" >&2
            exit 1
          }
          test -n "$KEYSTORE_BASE64" || { echo 'Missing PLAINCAST_KEYSTORE_BASE64' >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing PLAINCAST_KEYSTORE_PASSWORD' >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing PLAINCAST_KEY_ALIAS' >&2; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing PLAINCAST_KEY_PASSWORD' >&2; exit 1; }

      - name: Verify source and browser client
        run: ./scripts/check-static.sh

      - name: Test, lint, and build APKs
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAINCAST_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/plaincast-release.jks"
          chmod 600 "$RUNNER_TEMP/plaincast-release.jks"

      - name: Align, sign, and verify release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PLAINCAST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAINCAST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAINCAST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION_NAME="${RELEASE_TAG#v}"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$UNSIGNED_APK"
          test -f "$DEBUG_APK"

          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -P 16 -f -v 4 "$UNSIGNED_APK" "dist/PlainCast-${VERSION_NAME}-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/plaincast-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "dist/PlainCast-${VERSION_NAME}-release.apk" \
            "dist/PlainCast-${VERSION_NAME}-release-aligned.apk"
          rm "dist/PlainCast-${VERSION_NAME}-release-aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "dist/PlainCast-${VERSION_NAME}-release.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "dist/PlainCast-${VERSION_NAME}-release.apk"
          cp "$DEBUG_APK" "dist/PlainCast-${VERSION_NAME}-debug.apk"
          (
            cd dist
            sha256sum "PlainCast-${VERSION_NAME}-debug.apk" "PlainCast-${VERSION_NAME}-release.apk" > SHA256SUMS.txt
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: PlainCast-${{ env.RELEASE_TAG }}
          path: |
            dist/PlainCast-*-debug.apk
            dist/PlainCast-*-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -eq 3
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "PlainCast ${RELEASE_TAG#v}" --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "PlainCast ${RELEASE_TAG#v}" \
              --generate-notes \
              --latest
          fi
